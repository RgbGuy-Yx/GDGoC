services:
  - type: web
    name: gdgoc-vjit-recruitment-backend
    env: node
    plan: free
    buildCommand: npm install && npm run client:build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DEFAULT_ADMIN_ACCESS_CODE
        value: NEXUS-815
      - key: CLIENT_ORIGIN
        value: "*"
